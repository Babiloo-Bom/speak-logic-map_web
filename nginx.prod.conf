events {
    worker_connections 1024;
}

http {
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    # Upstream servers
    # Next.js App (Frontend + Backend API) - chạy trên port 1040
    upstream speak_logic_map_app {
        server localhost:1040;
    }

    # Adminer (Database Admin Tool) - chạy trên port 1041 (optional, chỉ dùng nội bộ)
    upstream speak_logic_map_adminer {
        server localhost:1041;
    }

    # HTTP server (SSL is terminated at host Nginx level)
    # This configuration is for when host Nginx handles SSL and forwards HTTP to this container
    server {
        listen 80;
        server_name map.rugal.vn www.map.rugal.vn;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Frontend (Next.js SSR)
        location / {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://speak_logic_map_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # WebSocket support (cho Next.js HMR và real-time features)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # Backend API (Next.js API routes)
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://speak_logic_map_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # WebSocket support for API (nếu có)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts (API có thể cần thời gian xử lý lâu hơn)
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            
            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # Static files (uploads, images, etc.)
        location /uploads/ {
            proxy_pass http://speak_logic_map_app;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Health check endpoint
        location /health {
            access_log off;
            proxy_pass http://speak_logic_map_app/api/hello;
            proxy_set_header Host $host;
        }

        # Adminer (Database Admin - chỉ nên truy cập nội bộ hoặc qua VPN)
        # Uncomment nếu muốn expose Adminer ra ngoài (KHÔNG KHUYẾN NGHỊ cho production)
        # location /adminer/ {
        #     limit_req zone=general_limit burst=5 nodelay;
        #     proxy_pass http://speak_logic_map_adminer/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     
        #     # Basic Auth (nên bật để bảo mật)
        #     auth_basic "Admin Area";
        #     auth_basic_user_file /etc/nginx/.htpasswd;
        # }
    }
}

