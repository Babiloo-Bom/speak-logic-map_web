name: CI/CD Docker Build and Deploy

# Luồng: GitHub Actions build image → push lên GHCR (ghcr.io) → server pull từ GHCR.
# Không dùng Docker Hub.
# Secrets bắt buộc: SERVER_HOST, SERVER_USER, SERVER_SSH_KEY
# GHCR_PULL_TOKEN (optional): GitHub PAT với read:packages - chỉ cần nếu package để private.
#   Nếu package public: vào repo → Packages → package → Package settings → Change visibility.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if no changes'
        required: false
        default: 'false'
        type: boolean

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set image name (GHCR, lowercase)
        id: image
        run: |
          echo "name=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=${{ github.ref_name }}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max
          platforms: linux/amd64

  deploy:
    name: Deploy to Production Server
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set image name (GHCR, lowercase)
        id: image
        run: |
          echo "name=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            export APP_IMAGE="${{ steps.image.outputs.name }}:latest"
            export GHCR_USERNAME="${{ github.repository_owner }}"
            export GHCR_PULL_TOKEN="${{ secrets.GHCR_PULL_TOKEN }}"
            export DEPLOY_PROJECT_DIR="/opt/speak-logic-map_web"
            
            cd "$DEPLOY_PROJECT_DIR" || exit 1
            
            git fetch origin && (git pull origin main || git pull origin master) || true
            
            chmod +x deploy.sh
            ./deploy.sh

      - name: Deployment notification
        if: success()
        run: |
          echo "✅ Deployment completed successfully!"
          echo "🚀 Application is now running on the production server"

      - name: Deployment failure notification
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Please check the logs above for details"

